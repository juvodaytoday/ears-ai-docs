name: Validate References

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate internal references
        run: python scripts/validate_refs.py
